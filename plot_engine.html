<!DOCTYPE html>
<html lang="en">
<head>
  <script src="project-safety.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Core Story Setup</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --main-blue: #1958ca;
      --accent-blue: #3b82f6;
      --glass-bg: rgba(24,39,70,0.94);
      --card-bg: rgba(255,255,255,0.12);
    }
    html, body { height: 100%; min-height: 100vh; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #143575 60%, #1958ca 100%);
      color: #e8ecfa;
      margin: 0;
      min-height: 100vh;
      padding: 0;
    }
    .container {
      max-width: 820px;
      margin: 36px auto;
      background: var(--glass-bg);
      border-radius: 18px;
      box-shadow: 0 4px 28px #06103a55;
      padding: 36px 32px 44px 32px;
      border: 1.5px solid #3b82f666;
      animation: fadein 0.7s;
    }
    @keyframes fadein { from { opacity: 0; transform: translateY(36px);} to {opacity:1;transform:none;}}
    h1 { font-size: 2.2em; margin: 0 0 10px 0; color: #fff; }
    .subhead { color: #b9d8fc; margin-bottom: 14px; }
    label {
      display: block;
      margin-top: 18px;
      font-weight: 500;
      color: #f0f4ff;
      letter-spacing: 0.02em;
    }
    input, select, textarea {
      width: 100%;
      max-width: 520px;
      padding: 10px 14px;
      margin-top: 6px;
      border-radius: 7px;
      border: 1.2px solid #284687;
      background: #19306a44;
      color: #e8ecfa;
      font-size: 1.03em;
      box-shadow: 0 1px 2px #10225233;
      outline: none;
      transition: border .18s;
    }
    input:focus, textarea:focus, select:focus {
      border: 1.8px solid var(--accent-blue);
      background: #223d7b6b;
    }
    textarea { resize: vertical; }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 0 0;
    }
    .rule-row {
      display: flex;
      gap: 8px;
      align-items: center;
      max-width: 520px;
    }
    .rule-row input {
      flex: 1;
    }
    .tag {
      background: #2563eb33;
      border-radius: 4px;
      padding: 3px 13px;
      font-size: 0.99em;
      color: #bee1fd;
      border: 1.2px solid #3b82f655;
      font-weight: 500;
      display: flex;
      align-items: center;
    }
    .tag button {
      margin-left: 8px;
      background: none;
      border: none;
      color: #60a5fa;
      cursor: pointer;
      font-size: 1.1em;
      transition: color .14s;
    }
    .tag button:hover { color: #fff; }
    .rules-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      max-width: 520px;
    }
    .rule-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .rule-handle {
      cursor: grab;
      color: #9ec6ff;
      font-size: 1.1em;
      user-select: none;
    }
    .rule-item.dragging {
      opacity: 0.6;
      border: 1px dashed #3b82f6;
      border-radius: 8px;
      padding: 4px;
    }
    .rule-item input {
      width: 100%;
      border-radius: 7px;
      border: 1.2px solid #284687;
      background: #19306a44;
      color: #e8ecfa;
      padding: 8px 10px;
      font-size: 1em;
    }
    .rule-item button {
      background: none;
      border: none;
      color: #f8b4b4;
      cursor: pointer;
      font-size: 1em;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .rule-item button:hover { color: #ff6b6b; background: #2a2242; }
    .template-btn {
      font-size: 1.05em;
      padding: 8px 18px;
      border-radius: 8px;
      background: linear-gradient(92deg, #2671f2, #2959de 90%);
      color: #fff;
      border: none;
      box-shadow: 0 2px 9px #10399a24;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background .15s, box-shadow .12s, color .14s;
      margin-right: 8px;
      margin-top: 8px;
      display: inline-block;
    }
    .template-btn:hover {
      background: linear-gradient(92deg, #2959de 0%, #60a5fa 100%);
      color: #e0f4ff;
      box-shadow: 0 6px 22px #2c5ada22;
    }
    .actions-row {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .section-divider {
      margin: 26px 0 18px 0;
      border: none;
      height: 2px;
      background: linear-gradient(to right, #3b82f6 0%, #143575 100%);
      opacity: 0.28;
      border-radius: 4px;
    }
    .fab-research {
      position: fixed;
      right: 32px;
      bottom: 32px;
      z-index: 9999;
      width: 62px;
      height: 62px;
      background: linear-gradient(130deg, #4befff 60%, #1958ca 100%);
      border-radius: 50%;
      box-shadow: 0 2px 22px #2b7aff66;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .14s, box-shadow .12s;
    }
    .fab-research:hover {
      background: linear-gradient(110deg, #1958ca 40%, #4befff 100%);
      box-shadow: 0 4px 34px #3be3ff99;
    }
    .fab-research .fab-icon {
      font-size: 2em;
      color: #14283c;
      filter: drop-shadow(0 2px 4px #fffbe933);
      user-select: none;
    }
    .fab-research:after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 78px;
      right: 0;
      background: #14283ccc;
      color: #fffbb0;
      padding: 6px 16px;
      border-radius: 9px;
      font-size: 1em;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .17s, transform .17s;
      white-space: nowrap;
    }
    .fab-research:hover:after {
      opacity: 1;
      transform: translateY(0);
    }
    .fab-core-hub {
      position: fixed;
      right: 32px;
      bottom: 110px;
      z-index: 9999;
      width: 74px;
      height: 74px;
      background: linear-gradient(130deg, #ffe285 60%, #1958ca 100%);
      border-radius: 50%;
      box-shadow: 0 2px 32px #ffd70088;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .14s, box-shadow .12s;
    }
    .fab-core-hub:hover {
      background: linear-gradient(110deg, #1958ca 40%, #ffe285 100%);
      box-shadow: 0 4px 34px #ffd70088;
    }
    .fab-core-hub .fab-icon {
      font-size: 2.5em;
      color: #14283c;
      filter: drop-shadow(0 2px 4px #fffbe933);
      user-select: none;
    }
    .fab-core-hub:after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 78px;
      right: 0;
      background: #14283ccc;
      color: #fffbb0;
      padding: 6px 16px;
      border-radius: 9px;
      font-size: 1em;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .17s, transform .17s;
      white-space: nowrap;
    }
    .fab-core-hub:hover:after {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 650px) {
      .container { padding: 14px 2vw 25px 2vw; }
    }
  </style>
  <script>
    getProjectId().then(projectId => {
      if (!projectId) {
        alert("No project selected!");
        window.location.href = "project_core.html";
      }
    });
  </script>
</head>
<body>
  <div class="fab-research" data-tooltip="Open Research Archive" onclick="window.open('research.html','_blank')">
    <span class="fab-icon">dYÿ</span>
  </div>
  <div class="fab-core-hub" data-tooltip="Back to Project Core Hub">
    <span class="fab-icon">dY?ÿ</span>
  </div>
  <div class="container">
    <button onclick="goToProjectCore()" class="template-btn" style="margin-bottom:18px; margin-top:-6px;">
      Back to Project Core Hub
    </button>
    <h1>Core Story Setup</h1>
    <div class="subhead">Define the story foundation before moving into events.</div>
    <form id="metaForm" onsubmit="saveMeta(true);return false;">
      <label>Story Title
        <input id="storyTitle" type="text" maxlength="80" placeholder="Title (e.g. The Last Gate)"/>
      </label>
      <label>Core Premise
        <textarea id="premise" rows="3" maxlength="240" placeholder="A concise core idea for the story."></textarea>
      </label>
      <label>Throughline
        <input id="throughline" type="text" maxlength="140" placeholder="Single-line throughline"/>
      </label>
      <label>Genre(s)
        <div class="tags" id="genreTags"></div>
        <input id="genreInput" type="text" maxlength="22" placeholder="Add a genre/tag & press Enter"/>
      </label>
      <label>Rules
        <div class="rules-list" id="ruleList"></div>
        <div class="rule-row">
          <input id="ruleInput" type="text" maxlength="120" placeholder="Add a rule"/>
          <button type="button" class="template-btn" onclick="addRuleFromInput()">Add Rule</button>
        </div>
      </label>
      <label>General Notes
        <textarea id="notes" rows="4" maxlength="600" placeholder="Any additional notes or constraints."></textarea>
      </label>
      <button type="submit" class="template-btn">Save Core Info</button>
    </form>
    <hr class="section-divider" />
    <div class="actions-row">
      <button class="template-btn" onclick="goToPlotStructure()">Open Plot Structure</button>
      <button class="template-btn" onclick="saveMeta(false); goToEventManager();">Continue to Event Manager</button>
    </div>
  </div>

  <script>
    function getQueryParam(name) {
      let params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    async function getProjectsAsync() { return await window.projectStoreGetProjects(); }
    async function setProjectsAsync(arr) { return await window.projectStoreSetProjects(arr); }

    let projectId = getQueryParam("id");
    let characterId = getQueryParam("characterId");
    let eventId = getQueryParam("eventId");
    let sceneId = getQueryParam("sceneId");
    let doc = null;

    function goToProjectCore() {
      let url = `project_core.html?id=${encodeURIComponent(projectId)}`;
      if (characterId) url += `&characterId=${encodeURIComponent(characterId)}`;
      if (sceneId) url += `&sceneId=${encodeURIComponent(sceneId)}`;
      if (eventId) url += `&eventId=${encodeURIComponent(eventId)}`;
      window.location.href = url;
    }
    document.querySelector('.fab-core-hub').onclick = goToProjectCore;

    async function loadDoc() {
      if (!projectId) return;
      let arr = await getProjectsAsync();
      let proj = arr.find(p => p.id === projectId);
      if (!proj) {
        alert("Project not found. Returning to dashboard.");
        window.location.href = "project_core.html";
        return;
      }
      doc = proj;
      if (!doc.meta) doc.meta = {};
      if (!Array.isArray(doc.meta.genres)) doc.meta.genres = [];
      if (!Array.isArray(doc.meta.rules)) doc.meta.rules = [];
    }

    async function saveDoc() {
      if (!projectId) return;
      let arr = await getProjectsAsync();
      let idx = arr.findIndex(p => p.id === projectId);
      if (idx === -1) return;
      doc.lastModified = (new Date()).toISOString();
      arr[idx] = doc;
      await setProjectsAsync(arr);
    }

    function renderMeta() {
      document.getElementById("storyTitle").value = doc.meta.storyTitle || "";
      document.getElementById("premise").value = doc.meta.premise || "";
      document.getElementById("throughline").value = doc.meta.throughline || "";
      document.getElementById("notes").value = doc.meta.notes || "";
      renderTags();
      renderRules();
    }

    function saveMeta(showAlert) {
      doc.meta.storyTitle = document.getElementById("storyTitle").value.trim();
      doc.meta.premise = document.getElementById("premise").value.trim();
      doc.meta.throughline = document.getElementById("throughline").value.trim();
      doc.meta.notes = document.getElementById("notes").value.trim();
      saveDoc();
      if (showAlert) alert("Core info saved!");
    }

    function renderTags() {
      const tagDiv = document.getElementById("genreTags");
      tagDiv.innerHTML = "";
      (doc.meta.genres || []).forEach((tag, i) => {
        const span = document.createElement("span");
        span.className = "tag";
        span.innerHTML = tag + ' <button onclick="removeTag(' + i + ')">x</button>';
        tagDiv.appendChild(span);
      });
    }
    function removeTag(i) {
      doc.meta.genres.splice(i, 1);
      saveDoc();
      renderTags();
    }
    document.getElementById("genreInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && this.value.trim()) {
        if (!doc.meta.genres.includes(this.value.trim())) {
          doc.meta.genres.push(this.value.trim());
        }
        this.value = "";
        saveDoc();
        renderTags();
        e.preventDefault();
      }
    });

    function renderRules() {
      const ruleDiv = document.getElementById("ruleList");
      ruleDiv.innerHTML = "";
      (doc.meta.rules || []).forEach((rule, i) => {
        const row = document.createElement("div");
        row.className = "rule-item";
        row.draggable = true;
        row.dataset.ruleIndex = i;
        row.ondragstart = (e) => {
          row.classList.add("dragging");
          e.dataTransfer.setData("ruleIndex", i);
        };
        row.ondragend = () => row.classList.remove("dragging");
        row.ondragover = (e) => e.preventDefault();
        row.ondrop = (e) => {
          e.preventDefault();
          const from = parseInt(e.dataTransfer.getData("ruleIndex"), 10);
          if (Number.isNaN(from) || from === i) return;
          const [moved] = doc.meta.rules.splice(from, 1);
          doc.meta.rules.splice(i, 0, moved);
          saveDoc();
          renderRules();
        };
        const handle = document.createElement("span");
        handle.className = "rule-handle";
        handle.textContent = "⋮⋮";
        const input = document.createElement("input");
        input.type = "text";
        input.value = rule;
        input.oninput = () => updateRule(i, input.value);
        const del = document.createElement("button");
        del.type = "button";
        del.textContent = "Remove";
        del.onclick = () => removeRule(i);
        row.appendChild(handle);
        row.appendChild(input);
        row.appendChild(del);
        ruleDiv.appendChild(row);
      });
    }
    function updateRule(i, value) {
      doc.meta.rules[i] = value;
      saveDoc();
    }
    function removeRule(i) {
      doc.meta.rules.splice(i, 1);
      saveDoc();
      renderRules();
    }
    function addRuleFromInput() {
      const input = document.getElementById("ruleInput");
      const value = input.value.trim();
      if (!value) return;
      if (!doc.meta.rules.includes(value)) {
        doc.meta.rules.push(value);
        saveDoc();
        renderRules();
      }
      input.value = "";
      input.focus();
    }
    document.getElementById("ruleInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        addRuleFromInput();
      }
    });

    function goToPlotStructure() {
      window.location.href = "plot_structure.html?id=" + encodeURIComponent(projectId);
    }
    function goToEventManager() {
      window.location.href = "event_manager.html?id=" + encodeURIComponent(projectId);
    }

    (async function initDoc() {
      await loadDoc();
      if (doc) renderMeta();
    })();
  </script>
</body>
</html>
